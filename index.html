<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Range Ton Biz — Majordome</title>
<meta name="description" content="Ton Majordome : balance tout, il range." />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#c2542a" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root {
    --bg:#f5f3ef; --surface:#fff; --surface-2:#faf8f4; --line:#e4dfd6;
    --ink:#23201c; --ink-soft:#6b6459; --accent:#c2542a; --accent-soft:#f0ddd2;
    --warn:#b7791f; --warn-soft:#f6ecd6; --alert:#a5352a; --ok:#4f7a4a;
    --radius:14px; --shadow:0 1px 2px rgba(35,32,28,.05),0 8px 24px rgba(35,32,28,.06);
    --f-display:"Fraunces",Georgia,serif; --f-body:"Inter",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1a1815; --surface:#232019; --surface-2:#201d17; --line:#37322a;
    --ink:#f0ece4; --ink-soft:#a89f90; --accent:#e07444; --accent-soft:#3a271d;
    --warn:#d9a441; --warn-soft:#33291757; --alert:#e0685a; --ok:#7fa877;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#1a1815; --surface:#232019; --surface-2:#201d17; --line:#37322a;
    --ink:#f0ece4; --ink-soft:#a89f90; --accent:#e07444; --accent-soft:#3a271d;
    --warn:#d9a441; --warn-soft:#33291757; --alert:#e0685a; --ok:#7fa877;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  header.app{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-bottom:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
  .brand .tag{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
  .theme-btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer;flex:none}
  main{flex:1;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;min-height:0}
  #log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:11px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.sys{align-self:center;background:var(--accent-soft);color:var(--accent);font-size:12.5px;text-align:center;border-radius:10px}
  .composer{border-top:1px solid var(--line);background:var(--surface);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
  .composer textarea{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:12px;padding:11px 12px;font-family:var(--f-body);font-size:15px;resize:none;max-height:140px;min-height:44px}
  .composer textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
  .send{border:none;background:var(--accent);color:#fff;border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
  .send:disabled{opacity:.5}
  .hint{font-size:11.5px;color:var(--ink-soft);text-align:center;padding:0 16px 8px}
  .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink-soft);margin:0 1px;animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
</style>
</head>
<body>
<header class="app">
  <div class="brand"><h1>Range Ton Biz</h1><span class="tag">Majordome</span></div>
  <button class="theme-btn" id="theme" aria-label="Thème">◐</button>
</header>
<main>
  <div id="log">
    <div class="msg sys">Balance tout : une idée, une tâche, un mail à trier, un document. Je range.</div>
    <div class="msg bot">Bonjour Amely. Qu'est-ce que je note pour toi ?</div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="composer">
    <textarea id="input" placeholder="Ex : idée — me faire une journée massage et soins" rows="1"></textarea>
    <button class="send" id="send" aria-label="Envoyer">↑</button>
  </div>
</main>
<script>
(function(){
  var t=document.getElementById('theme');
  t.onclick=function(){var c=document.documentElement.getAttribute('data-theme');var d=c?c==='dark':matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',d?'light':'dark')};
  var log=document.getElementById('log'),input=document.getElementById('input'),send=document.getElementById('send'),hint=document.getElementById('hint');
  var history=[];
  function add(role,text){var d=document.createElement('div');d.className='msg '+(role==='user'?'me':'bot');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
  input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';});
  function typing(){var d=document.createElement('div');d.className='msg bot';d.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
  async function go(){
    var v=input.value.trim(); if(!v) return;
    add('user',v); history.push({role:'user',content:v});
    input.value='';input.style.height='auto';send.disabled=true;
    var t=typing();
    try{
      var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
      var data=await r.json();
      t.remove();
      if(!r.ok){add('bot',data.error||'Erreur. Vérifie que les clés sont configurées dans Vercel.');}
      else{add('bot',data.reply);history.push({role:'assistant',content:data.reply});}
    }catch(e){t.remove();add('bot','Connexion impossible. L\'app n\'est peut-être pas encore activée (clés manquantes).');}
    send.disabled=false;input.focus();
  }
  send.onclick=go;
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}});
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
})();
</script>
</body>
</html>
